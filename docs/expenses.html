<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS · Expenses</title><link rel="stylesheet" href="css/atlas.utility.css?v=20260811-1"></head><body><main class="utility-shell" id="expenses-app"><header class="utility-topbar"><a href="index.html">‹</a><div><h1>Expenses</h1><div class="utility-sub">여행 준비 + 현지 지출 · Owner only</div></div></header><section class="utility-card"><form id="expense-form" class="utility-form"><label>날짜<input name="spentAt" type="date" required></label><label>카테고리<select name="category"><option>항공</option><option>숙박</option><option>교통</option><option>식비</option><option>쇼핑</option><option>관광</option><option>보험</option><option>기타</option></select></label><label>금액<input name="amount" type="number" min="0" step="0.01" required></label><label>통화<select name="currency" value="KRW" maxlength="3" required>
          <option value="KRW">KRW</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="TRY" selected>TRY</option>
          <option value="JPY">JPY</option>
          <option value="CNY">CNY</option>
          <option value="HKD">HKD</option>
          <option value="TWD">TWD</option>
          <option value="GBP">GBP</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="THB">THB</option>
          <option value="VND">VND</option>
          <option value="INR">INR</option>
        </select></label><label>원화 환율<input name="exchangeRate" type="number" min="0" step="0.0001" placeholder="비우면 ECB 기준환율 자동"></label><label>결제수단<select name="paymentMethod" placeholder="카드 / 현금"><option value="card">카드</option><option value="cash">현금</option></select></label><label class="wide">가맹점·항목<input name="merchant" placeholder="예: Turkish Airlines"></label><label class="wide">메모<textarea name="memo" rows="2"></textarea></label><button>지출 추가</button></form></section><section class="utility-card"><div class="utility-summary"><span>여행 총비용</span><strong id="expense-total">0원</strong></div><div id="expense-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config/config.example.js"></script><script src="config/config.public.js"></script><script src="services/atlas.supabase.js"></script><script src="services/atlas.auth.js"></script><script src="services/atlas.api.js?v=20260811-2"></script><script src="js/atlas.expenses.js?v=20260811-3"></script></body></html>
